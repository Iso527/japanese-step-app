];

const kata=[['ア','a'],['イ','i'],['ウ','u'],['エ','e'],['オ','o'],['カ','ka'],['キ','ki'],['ク','ku'],['ケ','ke'],['コ','ko'],['サ','sa'],['シ','shi'],['ス','su'],['セ','se'],['ソ','so'],['タ','ta'],['チ','chi'],['ツ','tsu'],['テ','te'],['ト','to'],['ナ','na'],['ニ','ni'],['ヌ','nu'],['ネ','ne'],['ノ','no'],['ハ','ha'],['ヒ','hi'],['フ','fu'],['ヘ','he'],['ホ','ho'],['マ','ma'],['ミ','mi'],['ム','mu'],['メ','me'],['モ','mo'],['ヤ','ya'],['ユ','yu'],['ヨ','yo'],['ラ','ra'],['リ','ri'],['ル','ru'],['レ','re'],['ロ','ro'],['ワ','wa'],['ヲ','wo'],['ン','n']];
const KEY='jpstep_v03';
let state=JSON.parse(localStorage.getItem(KEY)||'null')||{current:1,done:[],xp:0,streak:0,lastStudy:'',reviews:{},onboard:false,daily:0,dailyDate:'',kanaDone:0};
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
const app=document.getElementById('app');
function esc(s){return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;')}
function speak(t){if('speechSynthesis'in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ja-JP';u.rate=.82;speechSynthesis.speak(u)}}
function today(){return new Date().toISOString().slice(0,10)}
function touchStudy(){const d=today();if(state.lastStudy!==d){const y=new Date(Date.now()-86400000).toISOString().slice(0,10);state.streak=state.lastStudy===y?state.streak+1:1;state.lastStudy=d}if(state.dailyDate!==d){state.daily=0;state.dailyDate=d}}
function nav(active){return `<div class="bottomnav"><button class="navbtn ${active==='home'?'active':''}" onclick="home()">🏠<br>学习</button><button class="navbtn ${active==='kana'?'active':''}" onclick="kanaPage()">あ<br>五十音</button><button class="navbtn ${active==='review'?'active':''}" onclick="reviewPage()">🔁<br>复习</button></div>`}
function top(back=false){return `<div class="top"><button class="icon" aria-label="返回" onclick="${back?'home()':''}">${back?'←':''}</button><div class="brand">日语小步学</div><div></div></div>`}
function onboarding(){app.innerHTML=`<div class="onboard"><div class="logo">🌱</div><h1>日语小步学</h1><p class="muted">每天 10 分钟，从零开始，慢慢学会真正能用的日语。</p><section class="card"><b>我们会这样带你学</b><div class="checklist"><div class="check">👀 看懂一个小知识</div><div class="check">🔊 听懂并模仿日语</div><div class="check">💬 在小情景里用一次</div><div class="check">🔁 忘记的内容自动回来</div></div><button class="primary" onclick="begin()">开始我的第一次学习 →</button></section></div>`}
function begin(){state.onboard=true;save();home()}
function home(){touchStudy();save();const done=state.done.length,current=Math.min(state.current,lessons.length),daily=Math.min(state.daily,10),reviewCount=countDue();app.innerHTML=`${top(false)}<section class="hero"><div class="eyebrow">今日 10 分钟</div><h1>${current<=lessons.length?'第 '+current+' 课':'第一阶段完成 🎉'}</h1><p>${current<=lessons.length?lessons[current-1].title+' · '+lessons[current-1].goal:'你已经完成前 10 课。接下来重点是复习和真实场景。'}</p>${current<=lessons.length?`<button class="primary" onclick="startLesson(${current})">继续学习 · 约 5 分钟</button>`:`<button class="primary" onclick="reviewPage()">开始今天的复习 →</button>`}<div style="margin-top:16px"><div class="eyebrow">今日目标 ${daily}/10</div><div class="progress"><div class="bar" style="width:${daily*10}%"></div></div></div></section><div class="stats"><div class="stat"><b>${state.xp}</b><span>累计 XP</span></div><div class="stat"><b>🔥 ${state.streak}</b><span>连续学习</span></div><div class="stat"><b>${reviewCount}</b><span>待复习</span></div></div>${reviewCount?`<section class="section"><div class="callout"><b>🔁 有 ${reviewCount} 个内容快忘了</b><div class="muted">现在复习 2～5 分钟，比重新学一遍更有效。</div><button class="ghost" onclick="reviewPage()">现在复习 →</button></div></section>`:''}<section class="section"><h2>学习地图 · ${done}/${lessons.length}</h2><div class="progress"><div class="bar" style="width:${done/lessons.length*100}%"></div></div>${lessons.map(l=>`<div class="lesson-row ${state.done.includes(l.id)?'done':''}" onclick="${state.done.includes(l.id)?`startLesson(${l.id})`:l.id===current?`startLesson(${l.id})`:''}" style="${l.id===current||state.done.includes(l.id)?'cursor:pointer':''}"><div class="dot">${state.done.includes(l.id)?'✓':l.id}</div><div class="lesson-info"><b>第 ${l.id} 课 · ${l.title}</b><small>${l.goal}</small></div></div>`).join('')}</section><div class="footer-note">课程与学习记录保存在本机，基础课程可离线使用。</div>${nav('home')}`}
function startLesson(id){renderStep(lessons.find(x=>x.id===id),0)}
function renderStep(l,i){const s=l.steps[i];app.innerHTML=`<div class="screen">${top(true)}<div class="lesson-top"><span class="badge">第 ${l.id} 课</span><span class="count">${i+1} / ${l.steps.length}</span></div><div class="lesson-card">${stepHTML(s,i,l)}</div><div class="lesson-bottom" id="bottom"></div></div>`;const b=document.getElementById('bottom');if(['word','sentence','dialogue'].includes(s[0]))b.innerHTML=`<button class="primary" onclick="nextStep(${l.id},${i})">继续 →</button>`;if(s[0]==='task')b.innerHTML=`<button class="primary" onclick="completeTask(${l.id},${i})">我已经说出来了 ✓</button>`}
function stepHTML(s,i,l){if(s[0]==='word'||s[0]==='sentence')return `<div class="jp">${esc(s[1])}</div><div class="cn">${esc(s[2])}</div>${s[3]?`<div class="romaji">${esc(s[3])}</div>`:''}<button class="audio" onclick="speak(${JSON.stringify(s[1])})">🔊 播放日语</button>`;if(s[0]==='choice')return `<div class="question">${esc(s[1])}</div><div class="options">${s[2].map((x,n)=>`<button class="option" onclick="answerChoice(${l.id},${i},${n},this)">${esc(x)}</button>`).join('')}</div><div class="feedback" id="feedback"></div>`;if(s[0]==='audio')return `<div class="eyebrow" style="text-align:center">👂 先听，再选</div><button class="audio" onclick="speak(${JSON.stringify(s[1])})">🔊 播放</button><div class="question" style="margin-top:22px">你听到的是？</div><div class="options">${s[3].map((x,n)=>`<button class="option" onclick="answerChoice(${l.id},${i},${n},this)">${esc(x)}</button>`).join('')}</div><div class="feedback" id="feedback"></div>`;if(s[0]==='task')return `<div class="eyebrow">💬 情景任务</div><div class="question">${esc(s[1])}</div><div class="task-box" style="margin-top:24px"><b>参考表达</b>${esc(s[2])}</div><button class="audio" onclick="speak(${JSON.stringify(s[2])})">🔊 听参考发音</button>`;if(s[0]==='dialogue')return `<div class="eyebrow">💬 看一遍真实对话</div>${s[1].map(x=>`<div style="padding:10px 0;border-bottom:1px solid var(--line)"><b>${esc(x[0])}</b><div style="font-size:18px;margin-top:4px">${esc(x[1])}</div><button class="smallbtn" onclick="speak(${JSON.stringify(x[1])})">🔊</button></div>`).join('')}`}
function nextStep(id,i){const l=lessons.find(x=>x.id===id);i+1<l.steps.length?renderStep(l,i+1):finishLesson(l)}
function answerChoice(id,i,n,btn){const l=lessons.find(x=>x.id===id),s=l.steps[i],ans=s[0]==='choice'?s[3]:s[4],fb=document.getElementById('feedback');document.querySelectorAll('.option').forEach(b=>b.disabled=true);if(n===ans){btn.classList.add('correct');fb.textContent='✓ 很好！ '+(s[5]||'');setTimeout(()=>nextStep(id,i),450)}else{btn.classList.add('wrong');fb.textContent='还差一点，再听/想一次。';setTimeout(()=>{document.querySelectorAll('.option').forEach(b=>b.disabled=false);btn.classList.remove('wrong')},700)}}
function completeTask(id,i){nextStep(id,i)}
function finishLesson(l){touchStudy();if(!state.done.includes(l.id)){state.done.push(l.id);state.xp+=20;state.current=Math.min(lessons.length+1,l.id+1);state.daily=Math.min(10,state.daily+3);l.steps.filter(s=>['word','sentence'].includes(s[0])).forEach(s=>{const id=l.id+'_'+s[1];if(!state.reviews[id])state.reviews[id]={jp:s[1],cn:s[2],box:0,next:Date.now()+86400000}})}else state.daily=Math.min(10,state.daily+1);save();app.innerHTML=`<div class="screen">${top(false)}<div class="lesson-card complete"><div class="big">🎉</div><h1>第 ${l.id} 课完成！</h1><p class="muted">${l.title}</p><div class="learned"><b>你刚刚练过</b><ul>${l.steps.filter(s=>s[1]&&typeof s[1]==='string').slice(0,5).map(s=>`<li>${esc(s[1])}${s[2]?' · '+esc(s[2]):''}</li>`).join('')}</ul></div><div class="badge">+20 XP</div><div class="callout" style="text-align:left;margin-top:18px"><b>下一步</b><div>今天再花 2 分钟复习刚学内容，记忆会更牢。</div></div></div><div class="lesson-bottom"><button class="primary" onclick="reviewPage()">复习一下 →</button></div></div>`}
function countDue(){const now=Date.now();return Object.values(state.reviews).filter(x=>(x.next||0)<=now).length}
function ensureReviews(){lessons.forEach(l=>l.steps.forEach(s=>{if(['word','sentence'].includes(s[0])){const id=l.id+'_'+s[1];if(!state.reviews[id])state.reviews[id]={jp:s[1],cn:s[2],box:0,next:Infinity}}}));save()}
function reviewPage(){ensureReviews();const due=Object.entries(state.reviews).filter(([,x])=>(x.next||0)<=Date.now());app.innerHTML=`${top(false)}<section class="hero"><div class="eyebrow">🔁 间隔复习</div><h1>${due.length?'今天复习 '+due.length+' 个':'今天没有必须复习的内容 🎉'}</h1><p>${due.length?'优先复习快忘的内容，每次只做少量。':'继续完成课程，新的内容会自动进入复习库。'}</p>${due.length?`<button class="primary" onclick="reviewOne(0)">开始复习 · 约 ${Math.min(5,Math.max(2,Math.ceil(due.length/3)))} 分钟</button>`:''}</section><section class="section"><h2>复习规律</h2><div class="card"><div class="muted">记住 → 间隔变长；忘记 → 很快再见。这样不用每天重新背全部单词。</div></div></section>${nav('review')}`}
function reviewOne(index){const items=Object.entries(state.reviews).filter(([,x])=>(x.next||0)<=Date.now());if(!items[index]){save();reviewPage();return}const [id,x]=items[index];app.innerHTML=`${top(true)}<div class="lesson-card"><div class="eyebrow" style="text-align:center">复习 ${index+1}/${items.length}</div><div class="review-jp">${esc(x.jp)}</div><div class="cn">${esc(x.cn)}</div><button class="audio" onclick="speak(${JSON.stringify(x.jp)})">🔊 听发音</button><div class="review-actions"><button class="secondary" onclick="reviewAnswer(${JSON.stringify(id)},false,${index})">忘记了</button><button class="primary" onclick="reviewAnswer(${JSON.stringify(id)},true,${index})">记住了</button></div><p class="muted" style="text-align:center;margin-top:18px">先自己想意思，再点答案。</p></div>`}
function reviewAnswer(id,ok,index){const x=state.reviews[id];x.box=ok?Math.min(4,(x.box||0)+1):0;const days=ok?[1,3,7,14,30][x.box]||30:1;x.next=Date.now()+days*86400000;state.xp+=ok?2:1;state.daily=Math.min(10,(state.daily||0)+1);save();setTimeout(()=>reviewOne(index+1),150)}
let kanaMode='hira',kanaQuizIndex=0,kanaScore=0;
function kanaPage(){const data=kanaMode==='hira'?hira:kata;app.innerHTML=`${top(false)}<div class="tabs"><button class="tab ${kanaMode==='hira'?'active':''}" onclick="setKana('hira')">平假名</button><button class="tab ${kanaMode==='kata'?'active':''}" onclick="setKana('kata')">片假名</button></div><section class="card"><div class="eyebrow">第一步：认识</div><h2>${kanaMode==='hira'?'平假名':'片假名'}清音</h2><p class="muted">点一下听发音。每天先认识 5～10 个，不需要一次背完。</p><div class="kana-grid">${data.map(x=>`<button class="kana" onclick="speak(${JSON.stringify(x[0])})"><b>${x[0]}</b><small>${x[1]}</small></button>`).join('')}</div></section><section class="card section"><div class="eyebrow">第二步：听音辨认</div><h2>小测验</h2><p class="muted">不用会写，只要能把声音和假名对应起来。</p><button class="primary" onclick="startKanaQuiz()">开始 5 题 →</button></section>${nav('kana')}`}
function setKana(m){kanaMode=m;kanaPage()}
function startKanaQuiz(){kanaQuizIndex=0;kanaScore=0;renderKanaQuiz()}
function renderKanaQuiz(){const data=kanaMode==='hira'?hira:kata;if(kanaQuizIndex>=5){state.kanaDone=Math.max(state.kanaDone,kanaScore);state.xp+=kanaScore*2;save();app.innerHTML=`${top(false)}<div class="lesson-card complete"><div class="big">🌱</div><h1>五十音小测完成</h1><p class="muted">5 题答对 ${kanaScore} 题。</p><div class="badge">+${kanaScore*2} XP</div><div class="lesson-bottom" style="margin-top:25px"><button class="primary" onclick="kanaPage()">继续认识假名</button></div></div>`;return}const target=data[Math.floor(Math.random()*data.length)];const opts=[target];while(opts.length<3){const x=data[Math.floor(Math.random()*data.length)];if(!opts.includes(x))opts.push(x)}opts.sort(()=>Math.random()-.5);app.innerHTML=`${top(true)}<div class="lesson-top"><span class="badge">五十音</span><span class="count">${kanaQuizIndex+1} / 5</span></div><div class="lesson-card"><div class="eyebrow" style="text-align:center">听音选择假名</div><button class="audio" onclick="speak(${JSON.stringify(target[0])})">🔊 再听一次</button><div class="question" style="margin-top:28px">你听到的是什么？</div><div class="options">${opts.map((x,n)=>`<button class="option" onclick="kanaAnswer(${JSON.stringify(x[0])===JSON.stringify(target[0])},this)">${x[0]}　<small>${x[1]}</small></button>`).join('')}</div><div class="feedback" id="feedback"></div></div>`}
function kanaAnswer(ok,btn){document.querySelectorAll('.option').forEach(b=>b.disabled=true);const fb=document.getElementById('feedback');if(ok){btn.classList.add('correct');fb.textContent='✓ 对了！';kanaScore++}else{btn.classList.add('wrong');fb.textContent='再听一次，记住它的声音。'}setTimeout(()=>{kanaQuizIndex++;renderKanaQuiz()},600)}
let deferredInstall=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;const b=document.getElementById('installBanner');if(b)b.classList.add('show')});
window.addEventListener('appinstalled',()=>{deferredInstall=null;const b=document.getElementById('installBanner');if(b)b.classList.remove('show')});
function installApp(){if(deferredInstall){deferredInstall.prompt();deferredInstall.userChoice.finally(()=>{deferredInstall=null;const b=document.getElementById('installBanner');if(b)b.classList.remove('show')});return}const h=document.getElementById('installHelp');if(h)h.classList.add('show')}
if(!state.onboard){onboarding()}else home();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
